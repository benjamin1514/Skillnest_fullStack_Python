<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHub - Editar Libro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="/libros" class="brand">BookHub</a>
            <ul class="nav-links">
                <li><a href="/libros">Mis Libros</a></li>
                <li><a href="/favoritos">Mis Favoritos</a></li>
                <li><a href="/logout">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Editar Libro</h2>

        <!-- Mensajes Flash de error/validación -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="alerts error">
                    {% for msg in messages %}
                        <li>{{ msg }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form action="/libros/actualizar/{{ libro.id_libro }}" method="POST" class="form-card">
            
            <div class="form-group">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" value="{{ libro.titulo }}" required>
            </div>

            <div class="form-group">
                <label for="autor">Autor:</label>
                <input type="text" id="autor" name="autor" value="{{ libro.autor }}" required>
            </div>

            <div class="form-group">
                <label for="genero">Género:</label>
                <select id="genero" name="genero" required>
                    <option value="Novela" {% if libro.genero == 'Novela' %}selected{% endif %}>Novela</option>
                    <option value="Ciencia Ficción" {% if libro.genero == 'Ciencia Ficción' %}selected{% endif %}>Ciencia Ficción</option>
                    <option value="Fábula" {% if libro.genero == 'Fábula' %}selected{% endif %}>Fábula</option>
                    <option value="Romance" {% if libro.genero == 'Romance' %}selected{% endif %}>Romance</option>
                    <option value="Desarrollo Personal" {% if libro.genero == 'Desarrollo Personal' %}selected{% endif %}>Desarrollo Personal</option>
                    <option value="Fantasía" {% if libro.genero == 'Fantasía' %}selected{% endif %}>Fantasía</option>
                    <option value="Historia" {% if libro.genero == 'Historia' %}selected{% endif %}>Historia</option>
                </select>
            </div>

            <!-- Campo Fecha de Publicación pre-poblado -->
            <div class="form-group">
                <label for="fecha_publicacion">Fecha de publicación:</label>
                <input type="date" id="fecha_publicacion" name="fecha_publicacion" value="{{ libro.fecha_publicacion }}" required>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" rows="4" required>{{ libro.descripcion }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Actualizar</button>
                <a href="/libros" class="btn btn-secondary">Cancelar</a>
            </div>

        </form>
    </main>

</body>
</html>
