<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Mascota</title>
</head>
<body>

    {% if mascota %}
        <h1>Mascota Encontrada</h1>
        <ul>
            <li><strong>ID:</strong> {{ mascota.id }}</li>
            <li><strong>Nombre:</strong> {{ mascota.nombre }}</li>
            <li><strong>Tipo:</strong> {{ mascota.tipo }}</li>
            <li><strong>Color:</strong> {{ mascota.color }}</li>
        </ul>
    {% else %}
        <h1>Mascota no encontrada</h1>
        <p>No existe ningún registro para la mascota: <strong>{{ nombre_buscado }}</strong></p>
    {% endif %}

    <br>
    <a href="/">Volver a la lista principal</a>

</body>
</html>
