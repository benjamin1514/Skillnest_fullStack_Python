<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="moon-icon">🌙</div>
            <h1>El Juego del Destino</h1>
            <p>Descubre qué te depara el futuro</p>
        </div>

        <div class="card-body">
            <form action="/enviar" method="POST">
                
                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">📅</span>
                        <input type="number" id="edad" name="edad" required placeholder="Tu edad">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">🎨</span>
                        <input type="text" id="color" name="color" required placeholder="Tu color favorito">
                    </div>
                    <p class="input-help">Ej. green, red, blue, purple...</p>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">🐾</span>
                        <input type="text" id="animal" name="animal" required placeholder="Tu animal favorito">
                    </div>
                    <p class="input-help">Ej. perro, gato, águila, león...</p>
                </div>

                <div class="orb-container">
                    <div class="crystal-orb"></div>
                </div>

                <button type="submit" class="btn-submit">
                    ✏️ Revelar mi destino
                </button>
            </form>
        </div>
    </div>
</body>
</html>
